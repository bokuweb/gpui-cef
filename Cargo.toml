[workspace]
resolver = "2"
members = ["crates/gpui-cef", "examples/browser", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bokuweb/gpui-cef"

[workspace.dependencies]
# runtime_shaders: hand the shader source to Metal at runtime instead of
# compiling it with `xcrun metal` at build time, which removes the need for a
# full Xcode.app install.
# From Zed's repository, the way gpui-component takes it: an application's
# lockfile decides the revision, so this crate and the app link one gpui.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
cef = "151"
log = "0.4"
parking_lot = "0.12"
